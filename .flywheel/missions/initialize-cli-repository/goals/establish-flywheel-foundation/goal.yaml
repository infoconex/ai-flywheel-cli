id: establish-flywheel-foundation
objective: Initialize repository governance and define the CLI extraction boundary.
status: in_progress
success_criteria:
  - Required root Flywheel files exist.
  - Direct commits to main are prohibited.
  - CLI responsibilities are separated from framework assets.
  - Candidate CLI code, installers, and tests are identified for migration.
constraints:
  - No merge without explicit human approval.
validation_expectations:
  - Review initialized files for consistency.
  - Compare the branch against main.
